<!DOCTYPE html>
<html>
<head>
    <title>Test</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <h1 id="title">Hello!</h1>

    <button onclick="changeText()">
        Click Me
    </button>

    <script>
        function changeText() {
            document.getElementById("title").innerText =
                "Button Clicked!";
        }
    </script>

</body>
</html>
